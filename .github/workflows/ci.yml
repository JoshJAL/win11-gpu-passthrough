name: ci

# Runs on pull requests (never pull_request_target: fork code must not get a privileged token) and on
# pushes to main. The job is named "checks"; the repository ruleset on main requires exactly that name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: bash -n on every shell script
        run: |
          set -eu
          fail=0
          while IFS= read -r f; do
            if [ "$(head -c 2 "$f")" = '#!' ] && head -n1 "$f" | grep -q 'bash'; then
              bash -n "$f" || fail=1
            fi
          done < <(git ls-files)
          exit "$fail"

      - name: shellcheck
        run: |
          set -eu
          files=()
          while IFS= read -r f; do
            if [ -f "$f" ] && [ ! -L "$f" ] && head -n1 "$f" | grep -qE '^#!.*(bash|sh)'; then files+=("$f"); fi
          done < <(git ls-files)
          shellcheck --version
          shellcheck -x -S warning "${files[@]}"

      - name: Privacy fixtures and report tests
        run: |
          set -eu
          tests/fixtures/run-privacy-tests.sh
          tests/report/run-report-tests.sh

      - name: Report check (reports and COMPATIBILITY.md agree, no report overstates its tier)
        run: tools/report.sh --check

      - name: Privacy check on what this PR adds (static rules only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != pull_request ]; then
            tools/privacy-check.sh --static-only --tree
            exit 0
          fi
          # Use the checker and allowlist from the BASE branch, so a PR cannot allowlist its own leak.
          # The very first PR (which adds the checker) has no base copy and falls back to its own,
          # which the code owner reviews by hand.
          checker=tools/privacy-check.sh
          if git cat-file -e "$BASE_SHA:tools/privacy-check.sh" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/base"
            git archive "$BASE_SHA" tools | tar -x -C "$RUNNER_TEMP/base"
            checker="$RUNNER_TEMP/base/tools/privacy-check.sh"
          else
            echo "base has no privacy checker; using the one in this PR (owner reviews it)"
          fi
          "$checker" --static-only "$BASE_SHA..$HEAD_SHA"
